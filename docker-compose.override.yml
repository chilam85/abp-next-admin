  #     - sts-server

  # 取消注释以使用openiddict
  sts-server:
    build:
      context: ./aspnet-core/services/Publish/auth-server
    volumes:
      - ./deploy/framework/ids-sts/logs:/app/Logs
      - ./deploy/framework/ids-sts/modules:/app/Modules
    restart: always

  # 取消注释以使用openiddict
  sts-api:
    build:
      context: ./aspnet-core/services/Publish/auth-service
    volumes:
      - ./deploy/framework/ids-admin/logs:/app/Logs
      - ./deploy/framework/ids-admin/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  admin-api:
    build:
      context: ./aspnet-core/services/Publish/admin-service
    volumes:
      - ./deploy/framework/ids-admin/logs:/app/Logs
      - ./deploy/framework/ids-admin/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  localization-api:
    build:
      context: ./aspnet-core/services/Publish/localization-service
    volumes:
      - ./deploy/framework/localization/logs:/app/Logs
      - ./deploy/framework/localization/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  platform-api:
    build:
      context: ./aspnet-core/services/Publish/platform-service
    volumes:
      - ./deploy/framework/platform/logs:/app/Logs
      - ./deploy/framework/platform/modules:/app/Modules
      - ./deploy/framework/platform/blobs:/app/file-blob-storing
    restart: always
    depends_on:
      - sts-server

  messages-api:
    build:
      context: ./aspnet-core/services/Publish/message-service
    volumes:
      - ./deploy/framework/messages/logs:/app/Logs
      - ./deploy/framework/messages/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  task-api:
    build:
      context: ./aspnet-core/services/Publish/task-service
    volumes:
      - ./deploy/framework/task/logs:/app/Logs
      - ./deploy/framework/task/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  webhook-api:
    build:
      context: ./aspnet-core/services/Publish/webhook-service
    volumes:
      - ./deploy/framework/webhook/logs:/app/Logs
      - ./deploy/framework/webhook/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  workflow-api:
    build:
      context: ./aspnet-core/services/Publish/workflow-service
    volumes:
      - ./deploy/framework/workflow/logs:/app/Logs
      - ./deploy/framework/workflow/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  wechat-api:
    build:
      context: ./aspnet-core/services/Publish/wechat-service
    volumes:
      - ./deploy/framework/wechat/logs:/app/Logs
      - ./deploy/framework/wechat/modules:/app/Modules
    restart: always
    depends_on:
      - sts-server

  internal-apigateway:
    build:
      context: ./aspnet-core/services/Publish/internal-apigateway
    volumes:
      - ./deploy/framework/apigateway/logs:/app/Logs
      - ./deploy/framework/apigateway/modules:/app/Modules
    restart: always

  ui:
    build:
      # context: ./apps/vben5/apps/app-antd
      context: ./aspnet-core/services/Publish/client
    restart: always
