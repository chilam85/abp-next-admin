services:
  # sts-server:
  #   build:
  #     context: ./aspnet-core/services/Publish/identity-server
  #   volumes:
  #     - ./deploy/framework/ids-sts/logs:/app/Logs
  #     - ./deploy/framework/ids-sts/modules:/app/Modules
  #   restart: always

  # sts-api:
  #   build:
  #     context: ./aspnet-core/services/Publish/identity-service
  #   volumes:
  #     - ./deploy/framework/ids-admin/logs:/app/Logs
  #     - ./deploy/framework/ids-admin/modules:/app/Modules
  #   restart: always
